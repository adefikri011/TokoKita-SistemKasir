<div class="page-actions">
  <button id="btnRefreshPending" class="btn btn-ghost">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
    Muat Ulang
  </button>
</div>

<div class="table-card">
  <div class="table-scroll">
    <table class="data-table">
      <thead>
        <tr>
          <th>Kode</th>
          <th>Waktu</th>
          <th>Pelanggan / Item</th>
          <th style="text-align:right">Total</th>
          <th>Status</th>
          <th style="text-align:right">Aksi</th>
        </tr>
      </thead>
      <tbody id="pendingTableBody">
        <tr><td colspan="6" class="cell-empty">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="payModal" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:400px">
    <div class="modal-head" style="margin-bottom:16px">
      <div>
        <h3 class="modal-title">Lunasi Transaksi</h3>
        <p class="modal-desc">Pilih metode pembayaran</p>
      </div>
      <button type="button" id="btnClosePayModal" class="modal-close" aria-label="Tutup">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <div class="card" style="padding:13px 14px;margin-bottom:16px;background:var(--c-surface-2)">
      <p style="margin:0;font-size:13px;color:var(--c-text-2);font-weight:600" id="payModalInfo">—</p>
    </div>

    <div style="margin-bottom:6px">
      <label class="field-label" for="payMethod">Metode Pembayaran</label>
      <select class="field" id="payMethod"></select>
    </div>

    <div class="modal-foot">
      <button type="button" id="btnCancelPayModal" class="btn btn-ghost">Batal</button>
      <button type="button" id="btnConfirmPay" class="btn btn-success">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        Konfirmasi Lunas
      </button>
    </div>
  </div>
</div>
