<div class="pos-layout">

  <!-- ===== KIRI: Cari / Pindai + Daftar Barang ===== -->
  <section class="pos-catalog">
    <div class="pos-scan-box">
      <input type="text" id="posScanInput" class="field" autocomplete="off"
        placeholder="Arahkan scanner ke sini, atau ketik kode/nama lalu Enter...">
      <span class="pos-scan-hint">Tekan <kbd>Enter</kbd> untuk memindai</span>
    </div>

    <div id="posProductList" class="pos-product-list">
      <p style="color:#64748b;text-align:center;padding:32px 0">Memuat barang...</p>
    </div>
  </section>

  <!-- ===== KANAN: Keranjang + Pembayaran ===== -->
  <aside class="pos-cart">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-bold text-lg">Keranjang</h3>
      <button id="posClearCart" class="text-xs text-red-400 hover:underline">Kosongkan</button>
    </div>

    <div id="posCartItems" class="pos-cart-items">
      <p style="color:#64748b;text-align:center;padding:32px 8px">Keranjang masih kosong</p>
    </div>

    <div class="pos-cart-summary">
      <div class="pos-row"><span>Jumlah item</span><strong id="posItemCount">0</strong></div>
      <div class="pos-row pos-total"><span>Total</span><strong id="posTotal">Rp 0</strong></div>
    </div>

    <div class="pos-cart-form">
      <div>
        <label class="field-label" for="posCustomer">Nama Pelanggan <span style="font-weight:400">(opsional)</span></label>
        <input class="field" id="posCustomer" maxlength="100" placeholder="Umum">
      </div>

      <div>
        <label class="field-label" for="posPayment">Metode Pembayaran</label>
        <select class="field" id="posPayment">
          <option value="cash">Tunai (Cash)</option>
          <option value="qris">QRIS</option>
          <option value="debit">Kartu Debit</option>
          <option value="ewallet">E-Wallet</option>
          <option value="transfer">Transfer Bank</option>
        </select>
      </div>

      <div class="pos-actions">
        <button id="posPayNow" class="btn btn-primary" style="flex:1">Bayar &amp; Selesai</button>
        <button id="posSavePending" class="btn btn-ghost" style="flex:1">Simpan Pending</button>
      </div>
    </div>
  </aside>
</div>

<!-- Modal Ringkasan Transaksi -->
<div id="posResultModal" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:400px">
    <div style="text-align:center;margin-bottom:18px">
      <div class="pos-result-icon" id="posResultIcon">✓</div>
      <h3 id="posResultTitle" class="text-lg font-bold">Transaksi Berhasil</h3>
      <p id="posResultCode" style="color:#94a3b8;font-size:13px;margin:4px 0 0">—</p>
    </div>

    <div class="card" style="padding:14px;margin-bottom:16px">
      <div class="pos-row"><span>Total</span><strong id="posResultTotal">Rp 0</strong></div>
      <div class="pos-row"><span>Bayar</span><span id="posResultMethod">—</span></div>
    </div>

    <div class="flex gap-3">
      <button id="posResultClose" class="btn btn-ghost" style="flex:1">Tutup</button>
      <button id="posResultPrint" class="btn btn-primary" style="flex:1">Cetak Struk</button>
    </div>
  </div>
</div>
